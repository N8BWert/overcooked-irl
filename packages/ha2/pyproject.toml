[project]
name = "ha2"
version = "0.1.0"
description = "Hierarchical self-play on CoGrid Overcooked"
requires-python = ">=3.12"
dependencies = ["layouts", "common", "stable-baselines3==2.9.2", "sb3-contrib==2.9.2", "pygame-ce>=2.5.8"]

[project.scripts]
ha2 = "ha2.run:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
